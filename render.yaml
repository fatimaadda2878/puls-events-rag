services:
  - type: web
    name: puls-events-rag
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MISTRAL_API_KEY
        sync: false
      - key: REBUILD_API_KEY
        sync: false
      - key: MISTRAL_CHAT_MODEL
        value: mistral-small-latest
      - key: MISTRAL_EMBED_MODEL
        value: mistral-embed
      - key: MIN_RELEVANCE_SCORE
        value: "0.55"
      - key: OPENAGENDA_CITY
        value: Paris
      - key: OPENAGENDA_MAX_EVENTS
        value: "0"
